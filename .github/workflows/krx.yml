name: KRX Net-Buying Alert

on:
  schedule:
    # 한국시간(KST) 기준. GitHub가 러너를 못 구하거나 지연되어 실패해도
    # 뒤 시간대가 대신 보내주도록 백업 시각을 둠. (이미 보낸 날은 자동 skip → 중복 없음)
    - cron: '0 12 * * 1-5'    # 21:00 KST (주 실행)
    - cron: '30 13 * * 1-5'   # 22:30 KST (백업 1)
    - cron: '30 14 * * 1-5'   # 23:30 KST (백업 2)
  workflow_dispatch:          # 수동 실행 버튼 (테스트용)
    inputs:
      force:
        description: '이미 보낸 날이어도 강제 전송(테스트)'
        type: boolean
        default: false

permissions:
  contents: write             # 마지막 전송일 기록 파일을 저장소에 저장하기 위함

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 도구 설치
        run: pip install -r requirements.txt

      - name: 순매수율 분석 & 텔레그램 전송
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE: ${{ (inputs.force && '1') || '' }}
        run: python krx_alert_cloud.py

      - name: 마지막 전송일 기록 저장
        run: |
          if [ -n "$(git status --porcelain last_sent.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_sent.txt
            git commit -m "상태 업데이트: 마지막 전송 거래일"
            git push
          fi
